# research_agent 统一编排（硬化轮最终形态：postgres / redis / qdrant / backend / worker / frontend）。
#
# 范围（2026-10-11 硬化轮）：
#   - 基础设施：PostgreSQL 16 / Redis 7 / Qdrant（2026-09-17 骨架）。
#   - 应用：backend（researcher 入口 /api/v1 + SSE）、worker（KE Celery ingest）、
#     frontend（统一前端 + nginx 反代 /api）。模型/凭证/密钥全部走环境（.env.example 契约）。
#   - 本机冒烟与默认绑定遵循"默认仅本机访问"；对外暴露前必须 AUTH_ENABLED=true
#     并配置 AUTH_SECRET_KEY/AUTH_BOOTSTRAP_*（见 docs/design.md §9）。
#
# 端口与凭据全部可用 .env 覆盖；若与 RAG_sec 旧栈（cybersec-* 容器）同时运行，请改端口。
# 本机未启动 Docker 守护进程时 compose 仅做静态校验（docs/testing.md）。

name: research-agent

services:
  postgres:
    image: postgres:16
    container_name: ra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: ${POSTGRES_DB:-research_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research} -d ${POSTGRES_DB:-research_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ra-redis
    restart: unless-stopped
    # 开启 AOF，任务状态与缓存可恢复
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ra-qdrant
    restart: unless-stopped
    ports:
      # 6333: HTTP（SDK 与健康检查）
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: researcher/deep_research_system/Dockerfile
    container_name: ra-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      HOST: 0.0.0.0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build:
      context: ./knowledge_engine
      dockerfile: Dockerfile
    container_name: ra-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    command: ["python", "-m", "celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ra-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data: