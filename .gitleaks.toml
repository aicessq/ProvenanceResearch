# gitleaks 配置。
#
# 背景：`eval/corpus/` 收录了 RFC 6749（OAuth 2.0）规范原文，该 RFC 在自己
# 的示例流程中印有示例凭证——例如 refresh_token=tGzv3JOkF0XG5Qx2TlKWIA、
# client_secret=7Fjfp0ZBr1KtDRbnfVdmIw、access_token=2YotnFZFEjr1zCsicMWpAA。
# 这些是规范公开发布的示例值（原文以 "For example" 引出），不是任何人的真实凭证，
# 因此被 generic-api-key 规则误报。
#
# 处理原则：**只对这两个文件放行指定规则**，不全局关闭规则、不整目录放行——
# 若将来有真实凭证被误写进语料其他位置，扫描仍会命中。
# 参考：docs/decisions.md（2026-09-18 CI 第三类作业条目）。

[extend]
useDefault = true

[[allowlists]]
description = "RFC 6749 规范原文自带的示例凭证（公开标准文本，非真实凭证）"
paths = [
  '''eval/corpus/pdf/rfc_6749\.txt''',
  '''eval/corpus/text/rfc_6749\.pages\.jsonl''',
]
targetRules = ["generic-api-key"]
regexTarget = "match"