# Alembic configuration.
#
# Notes
# =====
# 1. Alembic is enabled starting from Phase 1 to manage database schema migrations.
# 2. The real database connection URL is not hardcoded here; env.py reuses Settings from app.config.
# 3. Commands run from backend/, so script_location resolves to its alembic directory.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
